  escalation:
    rules:
      - "Two failed attempts -> deeper diagnosis."
      - "Three failed attempts -> independent agent."
      - "Persistent disagreement -> stronger model or human."
      - "Model contradiction with tests -> trust executable evidence."

  provider_adapter:
