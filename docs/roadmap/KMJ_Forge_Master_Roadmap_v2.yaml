    Understand the structure and behavior of a repository without wasting
    model context on irrelevant files.

  scanners:
    - "File tree scanner"
    - "Language detector"
    - "Build-system detector"
    - "Package-manager detector"
    - "Framework detector"
    - "Test-framework detector"
    - "CI detector"
    - "Container detector"
    - "Infrastructure detector"
    - "Documentation detector"
    - "Git history scanner"

  indexes:
    structural:
      - "Files"
      - "Directories"
      - "Symbols"
      - "Classes"
      - "Functions"
      - "Interfaces"
      - "Modules"
    relational:
      - "Imports"
      - "Exports"
      - "Calls"
      - "Inheritance"
      - "Dependencies"
      - "Data flow"
      - "Test-to-code relationships"
    semantic:
      - "Code embeddings"
      - "Documentation embeddings"
      - "Issue embeddings"
      - "Commit embeddings"
    historical:
      - "Git commits"
      - "Blame"
      - "Changed-file history"
      - "Previous bug fixes"

  context_selection:
    strategy:
      - "Keyword retrieval"
      - "Symbol retrieval"
      - "Dependency traversal"
      - "Semantic retrieval"
      - "Git-history retrieval"
      - "Test relationship retrieval"
      - "Ranked context assembly"
    rule: "Prefer relevant evidence over repository-wide dumping."

# ============================================================
# 8. CONTEXT ENGINE
# ============================================================

context_engine:
  goals:
    - "Maximum reasoning quality per token."
    - "Keep context fresh."
    - "Prevent irrelevant repository flooding."
    - "Make previous failures available."
  packet:
    required:
      - "User request"
      - "Acceptance criteria"
      - "Relevant files"
      - "Relevant symbols"
      - "Dependencies"
      - "Existing tests"
      - "Build commands"
      - "Constraints"
    optional:
      - "Git history"
      - "Documentation"
      - "Previous attempts"
      - "Runtime logs"
      - "Screenshots"
  compression:
    - "Hierarchical summaries"
    - "Symbol-level summaries"
    - "Task summaries"
    - "Subagent result compression"
  invalidation:
    - "Changed files invalidate related context."
    - "Changed interfaces invalidate dependent summaries."
    - "New dependencies trigger graph refresh."

