# ============================================================
# 31. MVP DEFINITION
# ============================================================

mvp:
  objective: >
    Produce a useful autonomous coding agent that is genuinely free/local-first,
    rather than a UI demo around a paid API.

  must_have:
    - "CLI"
    - "Local model adapter"
    - "Filesystem"
    - "Terminal"
    - "Git"
    - "Repository scanner"
    - "Repository map"
    - "Semantic search"
    - "Planner"
    - "TDD"
    - "Debugger"
    - "Reviewer"
    - "Checkpoint"
    - "Rollback"
    - "Permission system"
    - "Audit log"
    - "Benchmark harness"

  should_not_have:
    - "Large SaaS platform"
    - "Complex social features"
    - "Mandatory cloud backend"
    - "Custom foundation model"
    - "Dozens of integrations"
    - "Automatic production deployment by default"

  MVP_success:
    task_set: "At least 50 difficult reproducible repository tasks."
    comparisons:
      - "Single-agent baseline"
      - "Forge with one local model"
      - "Forge with model routing"
    metrics:
      - "Verified success"
      - "Regression rate"
      - "Time"
      - "Cost"
      - "Human intervention"

