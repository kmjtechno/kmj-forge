# ============================================================
# 14. CODING ENGINE
# ============================================================

coding:
  rules:
    - "Read before editing."
    - "Follow existing project conventions unless intentionally changing them."
    - "Prefer minimal coherent changes."
    - "Do not rewrite unrelated code."
    - "Preserve public interfaces unless change is required."
    - "Use existing dependencies before adding new ones."
    - "Explain architectural changes in task memory."

  edit_strategy:
    - "Precise patch"
    - "AST-aware transformation where possible"
    - "Format after modification"
    - "Compile/type-check"
    - "Run targeted tests"

# ============================================================
# 15. TDD + TESTING
# ============================================================

testing:
  default:
    - "RED"
    - "GREEN"
    - "REFACTOR"
    - "VERIFY"

  layers:
    - "Unit"
    - "Component"
    - "Integration"
    - "Contract"
    - "End-to-end"
    - "Browser"
    - "Performance"
    - "Security"

  rules:
    - "Never weaken a test merely to obtain green."
    - "A passing test must exercise the requirement."
    - "Bug fixes should receive regression tests."
    - "Prefer deterministic tests."
    - "Run the narrowest relevant tests first, then expand."

# ============================================================
# 16. SYSTEMATIC DEBUGGING
# ============================================================

debugging:
  protocol:
    - "Collect exact error."
    - "Reproduce."
    - "Minimize reproduction."
    - "Inspect stack/logs."
    - "Trace control/data flow."
    - "Generate hypotheses."
    - "Design discriminating experiment."
    - "Test hypothesis."
    - "Identify root cause."
    - "Implement minimal fix."
    - "Reproduce original success."
    - "Run regression."
    - "Document prevention."

  failure_escalation:
    attempt_1: "Normal diagnosis."
    attempt_2: "Expanded context + history."
    attempt_3: "Independent debugger + stronger reasoning."
    attempt_4: "Architecture reset or human escalation."

  prohibited:
    - "Random patch loops."
    - "Deleting tests."
    - "Disabling checks."
    - "Hiding errors."
    - "Changing unrelated systems without evidence."

