# ============================================================
# KMJ FORGE — MASTER ROADMAP
# Universal + Free + Local-First AI Software Engineering Agent
# Version: 2.0
# Date: 2026-09-15
# ============================================================
#
# MASTER PRODUCT VISION
# ---------------------
# Build a genuinely universal AI software-engineering system that can
# understand, build, debug, test, review, optimize and ship almost any
# kind of software project.
#
# NON-NEGOTIABLE PRODUCT POSITION:
#   UNIVERSAL FIRST
#   FREE FIRST
#   LOCAL FIRST
#   OPEN-SOURCE FIRST
#   PROVIDER-AGNOSTIC
#   MODEL-AGNOSTIC
#   LANGUAGE-AGNOSTIC
#   IDE-AGNOSTIC
#   PLATFORM-AGNOSTIC
#
# Research references:
#   gstack       -> https://github.com/garrytan/gstack
#   Superpowers -> https://github.com/obra/superpowers
#   OpenHands   -> https://github.com/OpenHands/software-agent-sdk
#   SWE-agent   -> https://github.com/SWE-agent/SWE-agent
#   Aider       -> https://github.com/Aider-AI/aider
#   Cline       -> https://github.com/cline/cline
#   Gemini CLI   -> https://github.com/google-gemini/gemini-cli
#
# The goal is NOT to clone any of them.
# Their strongest engineering ideas are used as references for a new,
# modular, open, universal agent architecture.
# ============================================================

project:
  name: "KMJ Forge"
  codename: "Forge"
  version: "2.0"
  mission: >
    Create a universal AI software engineering agent that can take a
    natural-language goal, understand an unfamiliar project, plan the work,
    autonomously implement it, test it, debug failures, review its own work,
    verify the result, and optionally ship it.
  tagline: >
    Tell it what to build. Forge understands, plans, codes, tests, fixes,
    reviews and delivers.
  product_type: "Universal AI Software Engineering Operating System"

  primary_goals:
    - "Maximum universality"
    - "Maximum capability"
    - "Free and open-source operation wherever technically possible"
    - "Local-first execution"
    - "Optional cloud model support without provider lock-in"
    - "Reliable long-horizon autonomous coding"
    - "Evidence-based completion"
    - "Safe autonomy"
    - "Extensibility without rewriting the core"

  anti_goals:
    - "Do not become dependent on one commercial AI provider."
    - "Do not require a paid API for core operation."
    - "Do not optimize only for web development."
    - "Do not hard-code support for individual languages into the orchestrator."
    - "Do not copy gstack or Superpowers."
    - "Do not build a giant prompt instead of an actual engineering system."
    - "Do not claim success without verification evidence."
    - "Do not sacrifice security for autonomy."

# ============================================================
# 1. CORE PHILOSOPHY
# ============================================================

philosophy:
  universal_first:
    requirement: true
    meaning:
      - "Any language"
      - "Any framework"
      - "Any operating system"
      - "Any IDE"
      - "Any build system"
      - "Any repository layout"
      - "Any reasonable software domain"
    architecture_rule: >
      New language/framework/platform support must be addable through adapters,
      skills, analyzers, tool plugins or recipes rather than changes to the
      core orchestration engine.

  free_first:
    requirement: true
    meaning:
      - "Core project is free/open-source."
      - "Core agent must be able to run without paid APIs."
      - "Local models are first-class."
      - "Free/open-source tools are preferred."
      - "Cloud providers are optional adapters."
      - "No artificial feature lock that makes the free version useless."

  local_first:
    requirement: true
    principles:
      - "Local filesystem"
      - "Local Git"
      - "Local terminal"
      - "Local sandbox"
      - "Local models where available"
      - "Local embeddings/indexes"
      - "Local project memory"
      - "Offline-capable core workflows"

  open_source_first:
    requirement: true
    principles:
      - "Prefer permissively licensed components."
      - "Track licenses."
      - "Avoid dependencies that make distribution legally ambiguous."
      - "Allow users to replace major components."

  provider_agnostic:
    requirement: true
    supported_model_categories:
      - "Local Ollama-compatible models"
      - "OpenAI-compatible APIs"
      - "Anthropic-compatible APIs"
      - "Google-compatible APIs"
      - "Other OpenAI-compatible providers"
      - "Future providers"
    rule: "No provider-specific API in the core agent."

  model_agnostic:
    requirement: true
    rule: >
      The agent must reason about model capabilities rather than assume that
      one specific model is always best.

  evidence_over_claims:
    requirement: true
    rule: >
      'Done' means the implementation satisfies requirements and available
      verification evidence supports the claim.

