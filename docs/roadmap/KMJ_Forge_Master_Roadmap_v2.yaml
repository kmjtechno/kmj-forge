      - "Architecture RFC"
      - "Agent protocol"
      - "State machine"
      - "Permission model"
      - "Benchmark specification"
      - "Repository fixtures"
    gate:
      - "Interfaces versioned."
      - "Security model reviewed."
      - "MVP scope frozen."

  phase_01:
    name: "Minimal Universal Agent Kernel"
    priority: "P0"
    duration: "2-4 weeks"
