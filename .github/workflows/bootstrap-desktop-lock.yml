name: Bootstrap desktop lockfile

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [chore/community-health-setup]
    paths:
      - ".github/workflows/bootstrap-desktop-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/community-health-setup
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - name: Generate deterministic lockfile
        working-directory: desktop
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
      - name: Commit lockfile only
        run: |
          test -f desktop/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git diff --cached --quiet && exit 0
          git diff --cached --name-only | grep -qx 'desktop/package-lock.json'
          git commit -m "ci: lock desktop npm dependencies"
          git push origin HEAD:chore/community-health-setup
